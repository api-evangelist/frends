aid: frends

name: Frends

description: Frends provides a European AI‑augmented integration platform (iPaaS) that combines workflow automation, API management, data and
  application integration, and AI orchestration on a low‑code environment. It is targeted at enterprise customers across industries that need
  to connect legacy systems, ERP, cloud services, and embed AI while maintaining compliance with GDPR and EU regulations. The platform can be
  deployed in cloud, on‑premises, or hybrid settings and supports long‑running processes and governed AI.

